# /etc/nginx/sites-available/job-autopilot  (then symlink into sites-enabled)
# Replace jobs.example.com and the repo path. Get HTTPS with: sudo certbot --nginx -d jobs.example.com
# The dashboard holds personal data: keep it on HTTPS only.

server {
    listen 80;
    server_name jobs.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name jobs.example.com;

    # Filled in by certbot:
    # ssl_certificate     /etc/letsencrypt/live/jobs.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/jobs.example.com/privkey.pem;

    # Built dashboard: npm run build  ->  apps/web/dist
    root /home/deploy/job-autopilot/apps/web/dist;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/filtered, /settings, ...) fall back to the SPA.
    location / {
        try_files $uri /index.html;
    }
}
